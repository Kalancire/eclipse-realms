apply plugin: 'com.android.application'

// libGDX ships its native .so files as separate "natives" jars; this
// configuration collects them so copyAndroidNatives (below) can unpack them.
configurations { natives }

android {
    namespace 'com.eclipserealms.game.android'
    compileSdk 34

    defaultConfig {
        applicationId "com.eclipserealms.game"
        minSdkVersion 21   // covers SD680-class and older low-RAM devices
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"

        // 8GB RAM devices with SD680 (armeabi-v7a + arm64-v8a covers virtually all of them)
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    // Keep the APK small and fast to load on low-end devices
    packaging {
        resources {
            excludes += ['META-INF/robovm/ios/robovm.xml']
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    sourceSets {
        main {
            java.srcDirs += 'src/main/java'
            // Resources live in android/res (not the default src/main/res)
            res.srcDirs = ['res']
            assets.srcDirs += ['../core/src/main/assets']
            jniLibs.srcDirs += ['libs']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
}

// Copies native libs into jniLibs before packaging (standard libGDX task)
task copyAndroidNatives {
    doFirst {
        file("libs/armeabi-v7a/").mkdirs()
        file("libs/arm64-v8a/").mkdirs()

        configurations.natives.files.each { jar ->
            def outputDir = null
            if (jar.name.endsWith("natives-armeabi-v7a.jar")) outputDir = file("libs/armeabi-v7a")
            if (jar.name.endsWith("natives-arm64-v8a.jar")) outputDir = file("libs/arm64-v8a")
            if (outputDir != null) {
                copy {
                    from zipTree(jar)
                    into outputDir
                    include "*.so"
                }
            }
        }
    }
}

tasks.matching { it.name.contains("merge") && it.name.contains("JniLibFolders") }.configureEach {
    dependsOn copyAndroidNatives
}
